<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
<header class="site-header"><div class="wrap"><a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a><p class="tagline">{{ site.description }}</p></div></header>
<main class="wrap">
{{ content }}
</main>
<footer class="site-footer"><div class="wrap">© {{ site.time | date: '%Y' }} {{ site.title }}</div></footer>
</body>
</html>
